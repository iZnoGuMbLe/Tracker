networks:
  dev:

services:
  db:
    image: postgres:16.2
    container_name: tasktracker_db
    restart: always
    shm_size: 128mb
#    ports:
#      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev

  nginx:
    image: nginx:stable-alpine
    container_name: tasktracker_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx/nginx-temp.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./certbot/conf:/etc/letsencrypt:ro"
      - "./certbot/www:/var/www/certbot:ro"
    depends_on:
      - backend
    networks:
      - dev


  certbot:
      image: certbot/certbot
      container_name: tasktracker_certbot
      volumes:
        - ./certbot/conf:/etc/letsencrypt
        - ./certbot/www:/var/www/certbot
      entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"



  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasktracker_backend
    restart: always
#    ports:
#      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: ${DEBUG}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    env_file:
      - .env
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        alembic upgrade head &&
        echo 'Migrations complete!' &&
        echo 'Starting server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - dev

  prometheus:
    image: prom/prometheus:latest
    container_name: tasktracker_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
#    ports:
#      - "9090:9090"
    depends_on:
      - backend
    networks:
      - dev

  grafana:
    image: grafana/grafana:latest
    container_name: tasktracker_grafana
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
#    ports:
#      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - dev

  node-exporter:
    image: prom/node-exporter:latest
    container_name: tasktracker_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
#    ports:
#      - "9100:9100"
    networks:
      - dev

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: tasktracker_postgres_exporter
    restart: always
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
#    ports:
#      - "9187:9187"
    depends_on:
      - db
    networks:
      - dev

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: tasktracker_nginx_exporter
    restart: always
    command:
      - '-nginx.scrape-uri=http://nginx:80/nginx_status'
#    ports:
#      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - dev


volumes:
  postgres_data:
  prometheus_data:
  grafana_data:


